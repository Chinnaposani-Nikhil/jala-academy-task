      <h2>Fruit Names</h2>

    <p id="fruits">Apple, Banana, Mango, Orange, Grapes</p>

    <button onclick="sortFruits()">Sort Descending</button>

    <script>
        // Create an array of fruits
        let fruits = ["Apple", "Banana", "Mango", "Orange", "Grapes"];

        function sortFruits() {
            // Sort fruits in descending order
            fruits.sort().reverse();

            // Display the sorted array
            document.getElementById("fruits").innerHTML = fruits.join(", ");
        }
    </script>

  <h2>Person Details</h2>

    <p id="result"></p>

    <script>
        // Create a person object
        let person = {
            firstname: "Nikhil",
            lastname: "Chinnaposani"
        };

        // 1st way: Dot notation
        let firstName = person.firstname;
        let lastName = person.lastname;

        // 2nd way: Bracket notation
        let firstName2 = person["firstname"];
        let lastName2 = person["lastname"];

        // Display the properties
        document.getElementById("result").innerHTML =
            "Using Dot Notation: " + firstName + " " + lastName + "<br>" +
            "Using Bracket Notation: " + firstName2 + " " + lastName2;
    </script>
     
<h2>JavaScript Variable Hoisting</h2>

    <script>

        // var example
        console.log(z);

        var z = 10;

        console.log(z);


        // let example
        console.log(y);

        let y = 20;

        console.log(y);


        // const example
        console.log(s);

        const s = 30;

        console.log(s);

    </script>
